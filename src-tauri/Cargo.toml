[package]
name = "nsmpl"
version = "0.4.0-beta.3"
description = "Local audio sample tool with Nostr publishing"
authors = ["xjmzx"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nsmpl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Nostr identity: keypair generation, bech32 nsec/npub encoding. Matches ndisc.
nostr = "0.43"
# OS keychain (libsecret on Linux via secret-service). Matches ndisc.
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows needs its own keyring backend named explicitly. Without one the crate
# does not fail — it silently falls back to its in-memory `mock` store, which
# accepts a key, returns it for the rest of the process, and loses it on restart
# with no error at any point. A vanished signing key, reported as success. See
# SUITE.md, "Shared architecture conventions".
keyring = { version = "3", default-features = false, features = ["windows-native"] }

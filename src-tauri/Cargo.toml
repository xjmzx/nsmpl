[package]
name = "nsmpl"
version = "0.5.0"
description = "Local audio sample tool with Nostr publishing"
authors = ["xjmzx"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nsmpl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Nostr identity: keypair generation, bech32 nsec/npub encoding. Matches ndisc.
nostr = "0.43"

# --- OS keychain backend, per platform --------------------------------------
# Every platform must name its backend explicitly. With none for the platform
# being built, the crate does not fail — it silently falls back to its in-memory
# `mock` store, which accepts a key, returns it for the rest of the process and
# loses it on restart, with no error at any point. A vanished signing key,
# reported as success. See SUITE.md, "Shared architecture conventions".
#
# macOS was missing here until 2026-09-22 and hit exactly that: the nsec was
# accepted, the footer said "stored in keychain", and the next command that
# needed it answered "no Nostr identity stored". Worse than losing it on
# restart — `keyring_entry()` builds a new Entry per call and the mock keeps its
# credential per-instance, so the write and the read never saw the same store.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
